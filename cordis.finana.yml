# FinAna v2 组合配置：驱动 @deepseek-ai/dsh 的 JSON-RPC 运行时（dsh-jsonrpc-agent）。
# 以 deepseek-harness 官方示例 examples/jsonrpc-agent/cordis.yml 全文为基底修改：
#   * agent-spine.persona 由 adapter 经 DSH_SYSTEM_PROMPT 注入 loader 产物
#   * skills.enabled: true + filesystem.customSkillDirs 指向 finana/prompts/skills
#   * bash.timeoutMs 提到 120000
#   * 追加 mcp-finana 段，把 finana.mcp_server.server 以 stdio MCP server 挂载
# stdout 保留给 JSON-RPC 协议帧；不要添加 console logger 或终端 UI。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

# The DeepSeek adapter. Shipped default: full thinking at max effort on every
# request; exact-model resolution materializes request defaults before logging.
# The model arrives per session over JSON-RPC, so it is not pinned here.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 120000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js "process.env.DSH_SYSTEM_PROMPT ?? 'You are a helpful assistant.'"
    workspaceContext: false
    # 键名以 dsh-agent-spine-demo (skills.filesystem → dsh-skill-filesystem) README 为准：
    # customSkillDirs 是本地 skill 根目录列表，adapter 经 FINANA_SKILLS_DIR 注入绝对路径。
    skills:
      enabled: true
      filesystem:
        customSkillDirs:
          - !!js "process.env.FINANA_SKILLS_DIR ?? './finana/prompts/skills'"
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    # Snapshot runs read the raw JSONL back; production keeps zstd frames.
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# FinAna MCP server：模型侧工具名形如 mcp__finana__get_realtime_quote。
# failOnStartupError: false 保证 Python 侧未就绪时 dsh 仍可启动。
- id: mcp-finana
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: finana
    transport: stdio
    command: !!js "process.env.FINANA_PYTHON ?? '.venv/bin/python'"
    args: ['-m', 'finana.mcp_server.server']
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    failOnStartupError: false
