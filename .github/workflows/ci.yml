name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall agents api data llm memory storage users web_ui workflows tests

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >
          pytest
          tests/test_schemas.py
          tests/test_workflow_contracts.py
          tests/test_agents.py
          tests/test_api.py
          tests/test_users.py
          tests/test_users_api.py
          -m "not llm and not external_api"
          --cov=agents
          --cov=api
          --cov=data
          --cov=memory
          --cov=storage
          --cov=users
          --cov=workflows
          --cov-report=term-missing
